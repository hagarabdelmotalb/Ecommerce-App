<section>
    <h2 class="text-4xl text-green-600 my-4">{{ 'home.categories' | translate }}</h2>
    <div class="grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        @for (cat of categories; track cat._id) {
          <div [routerLink]="['/category', cat._id]"  class="text-center border p-4 rounded-lg shadow hover:shadow-lg transition duration-300">
            <img [src]="cat.image" class="w-full h-[350px] object-cover rounded-md" alt="">
            <h2 class="text-green-600 mt-2 text-xl font-semibold">{{ cat.name }}</h2>
          </div>
        }
      </div>
  </section>
