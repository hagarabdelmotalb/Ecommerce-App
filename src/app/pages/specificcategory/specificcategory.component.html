<section class="my-6">
    <div class="text-center mb-6">
      <h2 class="text-4xl text-green-600 font-bold">{{ category?.name }}</h2>
      @if (noProductsFound) {
        <div class="text-center text-red-600 text-xl font-semibold mt-6">
          There is no Products for this Category
        </div>
      }
      
    </div>
  
    <div class="grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      @for (product of categoryProducts; track product.id) {
        <div class="border p-3 rounded shadow hover:shadow-lg transition">
          <img [src]="product.imageCover" class="w-full h-[300px] object-cover mb-2 rounded" alt="">
          <h3 class="text-lg font-semibold">{{ product.title }}</h3>
          <p class="text-green-600">{{ product.price }} EGP</p>
        </div>
      }
    </div>
  </section>
